networks:
  transmuted_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # 1. Defensive Sensor: Zeek Network Security Monitor
  zeek_sensor:
    image: zeek/zeek:latest
    container_name: transmuted_zeek
    network_mode: "host"
    volumes:
      - ./zeek_logs:/usr/local/zeek/logs
    command: zeek -i eth0 local

  # Grafana Alloy Telemetry Pipeline
  alloy:
    image: grafana/alloy:latest
    container_name: transmuted_alloy
    networks:
      - transmuted_net
    ports:
      - "12346:12345"
    volumes:
      - ./telemetry/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./processed_logs:/var/log/transmuted:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped

  # 2. Offensive Engine: Kali Linux Sandbox
  kali_attacker:
    image: kalilinux/kali-rolling:latest
    container_name: transmuted_kali
    networks:
      - transmuted_net
    volumes:
      - ./attack:/root/attack
    command: /bin/sh -c "while true; do sleep 3600; done"
    restart: unless-stopped

  # 3. Transmutation Daemon: Converting Intrusion Logs to Telemetry
  transmuter:
    build: .
    container_name: transmutation_engine
    networks:
      - transmuted_net
    volumes:
      - ./zeek_logs:/var/log/zeek:ro
      - ./processed_logs:/var/log/transmuted:rw
    restart: unless-stopped

  # 4. Telemetry Pipeline: Loki Storage
  loki:
    image: grafana/loki:2.9.0
    container_name: transmuted_loki
    networks:
      - transmuted_net
    ports:
      - "3101:3100"

  # 5. Visualization: Grafana Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: transmuted_grafana
    networks:
      - transmuted_net
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=transmuted_drive
    depends_on:
      - loki
